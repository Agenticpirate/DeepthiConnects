

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deepthi Connects | Strategic Talent Sourcing & HR Solutions</title>
    <meta name="description" content="Expert Resume Writing, LinkedIn Optimization, and Startup HR Solutions by Deepthi Connects. 4+ years of experience in IT and non-IT recruitment." />
    
    <!-- Custom Neo-Brutalist Favicon: DC Monogram in Yellow Box with Broad Border -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' fill='%23FFDE59' stroke='%23000' stroke-width='6'/%3E%3Ctext x='50%25' y='58%25' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='900' font-size='32' letter-spacing='-2' fill='%23000'%3ED%3Ctspan fill='%23D583F0'%3EC%3C/tspan%3E%3C/text%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' fill='%23FFDE59' stroke='%23000' stroke-width='6'/%3E%3Ctext x='50%25' y='58%25' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='900' font-size='32' letter-spacing='-2' fill='%23000'%3ED%3Ctspan fill='%23D583F0'%3EC%3C/tspan%3E%3C/text%3E%3C/svg%3E" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'neo-yellow': '#FFDE59',
              'neo-purple': '#D583F0',
              'neo-blue': '#5CE1E6',
              'neo-red': '#FF5757',
              'neo-white': '#FAFAFA',
              'neo-black': '#1a1a1a',
              'neo-green': '#CCFF00',
              'neo-pink': '#FF0099',
            },
            fontFamily: {
              sans: ['Space Grotesk', 'sans-serif'],
              body: ['Inter', 'sans-serif'],
            },
            boxShadow: {
              'neo': '4px 4px 0px 0px rgba(0,0,0,1)',
              'neo-sm': '2px 2px 0px 0px rgba(0,0,0,1)',
              'neo-lg': '8px 8px 0px 0px rgba(0,0,0,1)',
              'neo-xl': '12px 12px 0px 0px rgba(0,0,0,1)',
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'float-delayed': 'float 6s ease-in-out 3s infinite',
              'wiggle': 'wiggle 2s ease-in-out infinite',
              'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-15px)' },
              },
              wiggle: {
                '0%, 100%': { transform: 'rotate(-2deg)' },
                '50%': { transform: 'rotate(2deg)' },
              }
            }
          }
        }
      }
    </script>
    
    <!-- Fonts: Space Grotesk for headings (Brutalist feel), Inter for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
    
    <style>
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 100px; /* Offset for sticky header */
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f3f4f6;
        color: #1a1a1a;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Space Grotesk', sans-serif;
      }
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      
      /* Professional Background Grid Pattern - Smaller grid on mobile, larger on desktop */
      .bg-pro-grid {
        background-size: 20px 20px;
        background-image:
          linear-gradient(to right, rgba(0, 0, 0, 0.04) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(0, 0, 0, 0.04) 1px, transparent 1px);
      }
      
      @media (min-width: 640px) {
        .bg-pro-grid {
          background-size: 40px 40px;
          background-image:
            linear-gradient(to right, rgba(0, 0, 0, 0.05) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
        }
      }
      
      /* Marquee Animation */
      .marquee-container {
        display: flex;
        overflow: hidden;
        user-select: none;
      }
      .marquee-content {
        flex-shrink: 0;
        display: flex;
        justify-content: space-around;
        min-width: 100%;
        gap: 3rem;
        animation: scroll 30s linear infinite; /* Slowed down for readability */
      }
      @keyframes scroll {
        from { transform: translateX(0); }
        to { transform: translateX(-100%); }
      }

      /* Reveal Animation Classes */
      .reveal-hidden {
        opacity: 0;
        transform: translateY(40px);
        transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .reveal-visible {
        opacity: 1;
        transform: translateY(0);
      }
    </style>

</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
